<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>Payment Details | Sophia Satvat</title>
  <style>
    :root { color-scheme: dark; --bg:#101010; --panel:#191919; --gold:#c6a66b; --muted:#aaa49a; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      background: radial-gradient(ellipse at 50% 0%, #29231b 0%, #151515 42%, var(--bg) 75%);
      color:#f7f3ec; font-family: Tahoma, Arial, sans-serif;
    }
    .card {
      width:min(100%, 430px); border:1px solid #4b3e2a; border-radius:24px;
      padding:30px 24px; background:linear-gradient(145deg, #202020, #121212 72%);
      box-shadow:0 24px 80px #0009; text-align:center;
    }
    .mark { color:var(--gold); font-size:12px; letter-spacing:3px; direction:ltr; margin-bottom:28px; }
    .ornament { color:var(--gold); font-size:20px; margin-bottom:12px; }
    h1 { font-size:25px; font-weight:500; margin:0 0 8px; }
    .subtitle { color:var(--muted); font-size:13px; margin:0 0 28px; }
    .label { color:var(--muted); font-size:12px; margin-bottom:12px; }
    .number {
      direction:ltr; unicode-bidi:isolate; font: 600 20px/1.8 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing:1px; color:#f5e5c7; padding:14px 8px; border:1px solid #51432e;
      background:#0e0e0e; border-radius:14px; overflow-wrap:anywhere;
    }
    button {
      width:100%; margin-top:14px; border:0; border-radius:12px; padding:14px 18px;
      background:var(--gold); color:#17130d; font:600 14px Tahoma, Arial, sans-serif; cursor:pointer;
      transition:transform .15s ease, filter .15s ease;
    }
    button:hover { filter:brightness(1.07); }
    button:active { transform:scale(.99); }
    .holder { margin-top:24px; color:#fff; font-size:16px; }
    .holder small { display:block; color:var(--muted); font-size:11px; margin-bottom:8px; }
    .note { margin:22px 0 0; color:#89847b; font-size:11px; line-height:1.9; }
    #status { min-height:20px; margin-top:9px; color:#d7c08e; font-size:12px; }
    .footer { margin-top:24px; color:#6f6a61; font-size:10px; letter-spacing:2px; direction:ltr; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">S O P H I A&nbsp; S A T V A T</div>
    <div class="ornament">✦</div>
    <h1>اطلاعات واریز</h1>
    <p class="subtitle">Payment details · Private &amp; elegant</p>
    <div class="label">برای کپی شماره کارت، دکمه را بزنید</div>
    <div class="number" id="cardNumber" aria-label="شماره کارت">6219 8618 0865 3108</div>
    <button id="copyButton" type="button">کپی شماره کارت</button>
    <div id="status" role="status" aria-live="polite"></div>
    <div class="holder"><small>به نام</small>سوفیا سطوت</div>
    <p class="note">پس از کپی، شماره کارت را در اپلیکیشن بانکی خود وارد و نام صاحب کارت را بررسی کنید.</p>
    <div class="footer">THANK YOU FOR YOUR BUSINESS</div>
  </main>
  <script>
    const cardNumber = "6219861808653108";
    const button = document.getElementById("copyButton");
    const status = document.getElementById("status");
    button.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(cardNumber);
        status.textContent = "شماره کارت کپی شد ✓";
        button.textContent = "کپی شد ✓";
      } catch (err) {
        const field = document.createElement("textarea");
        field.value = cardNumber;
        field.setAttribute("readonly", "");
        field.style.position = "fixed";
        field.style.opacity = "0";
        document.body.appendChild(field);
        field.select();
        const ok = document.execCommand("copy");
        field.remove();
        status.textContent = ok ? "شماره کارت کپی شد ✓" : "شماره کارت را دستی انتخاب و کپی کنید.";
        if (ok) button.textContent = "کپی شد ✓";
      }
      setTimeout(() => { button.textContent = "کپی شماره کارت"; }, 2200);
    });
  </script>
</body>
</html>
